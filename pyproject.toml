[project]
name = "soc-copilot"
version = "0.1.0"
description = "An AI investigation copilot that takes an alert and walks you through the analyst workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
soc-copilot = "soc_copilot.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soc_copilot"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# A focused, high-signal set: pyflakes (F) catches the bugs a compiler
# would — unused imports, undefined names — while E/W/I keep whitespace
# and import order honest. Deliberately NOT the opinionated refactor
# rules (UP/FURB/SIM/…): line length in the prompt strings is a
# considered choice, and CI should flag defects, not taste.
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines are intentional in prompt/message text

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# Which tests spend money is a property of the test, not of a path list a
# reader has to remember: `-m "not live"` is the free suite, `-m live` the
# API-backed one. (An --ignore list silently absorbs every new live file.)
markers = [
    "live: makes real Anthropic API calls — slow and costs money",
]
