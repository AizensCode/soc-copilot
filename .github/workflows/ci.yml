name: CI

# The free suite (`-m "not live"`) and the linter are deterministic and
# need no secrets — so they can guard every push and PR. The live,
# API-backed tests cost money and are intentionally NOT run here; they
# are the author's pre-merge calibration step.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # No .env, no API keys: this is the guarantee lazy config buys —
      # importing the package and running the free suite must work with
      # an empty environment, exactly as CI has it here.
      - name: Lint
        run: uv run ruff check soc_copilot/ tests/

      - name: Free test suite (no network, no API keys)
        run: uv run pytest -m "not live"
